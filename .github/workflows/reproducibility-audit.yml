name: Reproducibility audit

on:
  push:
    paths:
      - '.github/workflows/reproducibility-audit.yml'
      - 'audit/verify_manuscript_outputs.py'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install reference environment
        run: |
          python -m pip install --upgrade pip
          pip install -r environment/requirements-reference.txt
          python --version
          pip freeze | grep -E '^(numpy|pandas|scipy|scikit-learn|lightgbm|matplotlib|joblib|requests)=='

      - name: 1 Validate archived data
        run: python 01_data_retrieval/validate_data_archive.py --data 01_data_retrieval/data/sdss_dr17_randomized_150k.csv.gz --ids 01_data_retrieval/data/randomized_object_ids.csv.gz

      - name: 2 Development validation and final-test evaluation
        run: python 02_validation/run_repeated_cv_final_test.py --data 01_data_retrieval/data/sdss_dr17_randomized_150k.csv.gz --out validation_output

      - name: 3 Spatial validation
        run: python 03_spatial_validation/run_spatial_validation.py --data 01_data_retrieval/data/sdss_dr17_randomized_150k.csv.gz --out spatial_validation_output

      - name: 4 Magnitude robustness
        run: python 04_magnitude_robustness/run_magnitude_robustness.py --data 01_data_retrieval/data/sdss_dr17_randomized_150k.csv.gz --f4-model validation_output/F4_selected_model.joblib --f7-model validation_output/F7_selected_model.joblib --out magnitude_robustness_output

      - name: 5 Photometric-uncertainty analysis
        run: python 05_photometric_uncertainty/run_photometric_uncertainty.py --data 01_data_retrieval/data/sdss_dr17_randomized_150k.csv.gz --f4-model validation_output/F4_selected_model.joblib --f7-model validation_output/F7_selected_model.joblib --out photometric_uncertainty_output

      - name: 6 Grouped permutation importance
        run: python 06_grouped_permutation/run_grouped_permutation.py --data 01_data_retrieval/data/sdss_dr17_randomized_150k.csv.gz --f4-model validation_output/F4_selected_model.joblib --f7-model validation_output/F7_selected_model.joblib --out grouped_permutation_output

      - name: 7 Probability calibration
        run: python 07_probability_calibration/run_probability_calibration.py --data 01_data_retrieval/data/sdss_dr17_randomized_150k.csv.gz --f4-model validation_output/F4_selected_model.joblib --f7-model validation_output/F7_selected_model.joblib --out probability_calibration_output

      - name: 8 Class-prevalence sensitivity
        run: python 08_prior_shift/run_prior_shift.py --data 01_data_retrieval/data/sdss_dr17_randomized_150k.csv.gz --f4-model validation_output/F4_selected_model.joblib --f7-model validation_output/F7_selected_model.joblib --out prior_shift_output

      - name: Prepare freshly generated sources for Figure 1-5
        run: |
          cp validation_output/Table_3_repeated_CV_macroF1_mean_sd.csv tables/Table_3_repeated_CV_macroF1_mean_sd.csv
          cp validation_output/F4_final_test_confusion_matrix.csv tables/F4_final_test_confusion_matrix.csv
          cp validation_output/F7_final_test_confusion_matrix.csv tables/F7_final_test_confusion_matrix.csv
          cp magnitude_robustness_output/Table_6_magnitude_robustness.csv tables/Table_6_magnitude_robustness.csv
          cp magnitude_robustness_output/class_conditional_recall_results.csv 04_magnitude_robustness/class_conditional_recall_results.csv
          cp probability_calibration_output/reliability_curve_data.csv 07_probability_calibration/reliability_curve_data.csv
          cp grouped_permutation_output/Table_8_grouped_permutation_importance.csv tables/Table_8_grouped_permutation_importance.csv

      - name: 9 Figure generation
        run: python figures/generate_figures.py

      - name: Compare regenerated Tables 3-8 and Figure 1-5 with manuscript
        run: python audit/verify_manuscript_outputs.py

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-audit-outputs
          if-no-files-found: warn
          path: |
            validation_output/
            spatial_validation_output/
            magnitude_robustness_output/
            photometric_uncertainty_output/
            grouped_permutation_output/
            probability_calibration_output/
            prior_shift_output/
            figures/Figure_1_repeated_CV_macroF1.png
            figures/Figure_2_confusion_matrices.png
            figures/Figure_3_magnitude_robustness.png
            figures/Figure_4_reliability_curves.png
            figures/Figure_5_grouped_permutation_importance.png
